message AnyTestOp {
  oneof op {
    TestOpAlwaysOk op_always_ok = 50;
    TestOpIsDefined op_is_defined = 1; // done
    TestOpIsNull op_is_null = 2; // done
    TestOpBoolIsTrue op_bool_is_true = 3; // done
    TestOpBoolIsFalse op_bool_is_false = 4; // done
    TestOpNumberEq op_number_eq = 5;
    TestOpNumberLt op_number_lt = 6;
    TestOpNumberLte op_number_lte = 7;
    TestOpNumberGt op_number_gt = 8;
    TestOpNumberGte op_number_gte = 9;
    TestOpNumberRemainderEquals op_number_remainder_equals = 10;
    TestOpStringEquals op_string_equals = 11; // done
    TestOpStringIncludes op_string_includes = 12; // done
    TestOpStringStartsWith op_string_starts_with = 13; // done
    TestOpStringEndsWith op_string_ends_with = 14; // done
    TestOpStringMatchesRegex op_string_matches_regex = 15; // done
    TestOpArraySize op_array_size = 16;
    TestOpArrayAny op_array_any = 17; // done
    TestOpArrayAll op_array_all = 18; // done
    TestOpObjectSize op_object_size = 19;
    TestOpEqualsJson op_equals_json = 20;
    TestOpMatchesJson op_matches_json = 21;
    TestOpContainsJson op_contains_json = 22;
  }
}

