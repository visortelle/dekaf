message ResumeRequest {
  string consumer_name = 1;
  bool include_consumer_stats = 2;
  bool is_debug = 3;

  // Cap on how many messages per second this session DELIVERS to the client, applied from this
  // resume onward. 0 means unlimited; negative is refused outright.
  //
  // PER REQUEST, NOT PER SESSION CONFIG, like the two flags above it, and deliberately so: the
  // value belongs to the BROWSER doing the watching (it lives in localStorage), so it must never
  // travel into a saved library item and follow the session to another person's screen.
  //
  // The limit shapes steady-state delivery only. Start-from positioning - the counted skip of a
  // "skip first n" or the retained-history walk of a "latest n" - is never slowed by it: those
  // messages were never going to be shown, and slowing the seek would only delay the first visible
  // message. The count is per SESSION, not per partition, so the number means what it says
  // regardless of how many partitions the selector matched.
  int64 max_messages_per_second = 4;

  // Deliver AT MOST this many messages on this stream, then deliver nothing more until the next
  // resume. 0 means no budget; negative is refused.
  //
  // The count is of messages LOADED - the ones that passed every filter and went on the wire, the
  // number the toolbar's "loaded" counter shows - not of messages processed. A session whose
  // filters drop most of what they read may well process hundreds to load ten; the budget lets it,
  // and stops the STREAM at exactly ten.
  //
  // Enforced at the delivery drain, EXACTLY: the message that spends the last unit is the last one
  // sent, whatever was mid-batch behind it stays queued - unacknowledged, undelivered - for the
  // next resume. A client-side "pause after n" can only ever be approximate (a whole chunk lands
  // before the client can react, and the first chunk under a rate limit is the full one-second
  // burst); this is the server-side half that makes the number mean itself.
  int64 max_messages_to_deliver = 5;
}

// Progress of a start-from position that has to be resolved by counting messages
// rather than by seeking. Only NthMessageAfterEarliest needs this: skipping N
// messages exactly costs O(N) because Pulsar stores no message-ordinal index, so
// a large N takes real time and the UI must be able to say so.
message StartFromProgress {
  int64 messages_skipped = 1;
  int64 messages_to_skip = 2;
  // True once the requested position has been reached and normal delivery began.
  bool complete = 3;
  // True once the position was resolved BEST-EFFORT rather than exactly: a stream the merge was
  // waiting on stayed silent past the stall window and was abandoned (named below). The COUNT is
  // still exact; WHICH messages were dropped may differ from the exact answer. Sticky for the
  // session - a degradation that happened does not un-happen.
  bool degraded = 4;
  // The streams ("consumer@topic") the resolution gave up waiting for.
  repeated string abandoned_streams = 5;
}

message ConsumerStats {
  // Absent unless the session's start-from is still being resolved.
  StartFromProgress start_from_progress = 1;
}

message ResumeResponse {
  google.rpc.Status status = 1;
  repeated Message messages = 2;
  ConsumerStats consumer_stats = 4;
}

