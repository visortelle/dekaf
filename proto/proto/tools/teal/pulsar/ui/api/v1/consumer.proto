// Start approximately this far through the entries a physical topic still retains.
// Each topic and each partition is positioned independently. Interior fractions
// leave floor(fraction * retained_entries) entries behind; batching therefore
// makes this an entry position, not an exact message-count position.
message ApproximateEntryPosition {
  // 0.0 = earliest retained entry. 1.0 = MessageId.latest, past retained entries,
  // so only messages published after the seek is applied are shown. Other values
  // must be within [0.0, 1.0].
  double fraction = 1;
}

// Start approximately this far between the session's observed first- and final-entry
// publish times. The boundary is pooled across EVERY selected physical topic and every
// topic seeks to the same instant, so a multi-topic session has ONE cutoff rather than
// one per topic - without that, 50% meant a different moment on each topic.
message ApproximatePublishTimePosition {
  // 0.0 = earliest retained message. 1.0 = the greatest final-entry publish time
  // observed across the session's selected topics; every message sharing that timestamp
  // can be included. Other values must be within [0.0, 1.0]. Producer clock skew
  // makes this boundary estimate approximate.
  double fraction = 1;
}

