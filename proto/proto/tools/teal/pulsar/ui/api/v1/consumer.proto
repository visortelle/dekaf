// How a session that reads MORE THAN ONE delivery stream (several topics, or one partitioned
// topic) interleaves MESSAGE delivery across them.
enum MessageDeliveryOrder {
  // Uses BEST_EFFORT_BY_PUBLISH_TIME, the product default (owner decision 2026-08-09,
  // superseding the earlier decision that made GUARANTEED the default). Zero is also proto3
  // absence, so every older client and every config saved before this field existed lands here:
  // a session that never named an order merges with bounded lateness and never stalls on a
  // silent stream. GUARANTEED is an explicit choice; its indefinite wait is still reported to
  // the client (see delivery_order_waiting_streams) and the UI still offers the one-click
  // switch to Best effort.
  MESSAGE_DELIVERY_ORDER_UNSPECIFIED = 0;
  // Every stream delivers independently and messages interleave as they arrive. Fastest.
  MESSAGE_DELIVERY_ORDER_AS_RECEIVED = 1;
  // One merged stream ordered by the selected time, BEST EFFORT (bounded lateness). THE PRODUCT
  // DEFAULT, and what UNSPECIFIED resolves to: delivery is held for a short reorder window so
  // quieter streams get their say. Timestamps are stamped outside the session's control, so skew
  // or a slow stream can still deliver late - late messages are delivered out of order, never
  // dropped - and delivery lags by up to the window plus one sweep period (~0.5-0.75s in total)
  // whenever some stream is quiet.
  //
  // THE NAME IS HISTORICAL. This mode predates delivery_order_key, so its constant still says
  // "by publish time" while the timestamp it actually compares is whichever DeliveryOrderKey the
  // session selected - publish time, broker publish time or event time. The constant and its
  // value 2 are frozen: renaming or aliasing them would break every saved item and every older
  // client for a cosmetic gain. Internally the mode is called plain "best effort"
  // (Scala MessageDeliveryOrder.BestEffort, TS 'best-effort').
  MESSAGE_DELIVERY_ORDER_BEST_EFFORT_BY_PUBLISH_TIME = 2;
  // AN EXACT REPLAY (owner decision 2026-08-09). One merged stream ordered by the selected
  // time: the session delivers everything recorded up to the moment Play was pressed (of what
  // retention still holds - a trimmed message is gone for any reader), in strict key order, and
  // then AUTO-PAUSES, announcing it on ConsumerStats.replay_caught_up. No live phase: a message
  // recorded past the boundary is held for the NEXT chunk (its consumer paused) rather than
  // delivered. Resume extends the boundary to now and replays the delta - itself immutable by
  // then - exactly; ordering violations are impossible within a chunk, and across a resume seam
  // they require producer clock skew and are delivered loudly flagged
  // (Message.replay_seam_violation), never silently. An explicit choice, never what absence
  // resolves to. Source append order is preserved, so timestamp inversions already stored within
  // one source pass through and are counted. Failed sends retry in place. A stream whose
  // recorded range retention trimmed away can still hold a replay (the wait is disclosed via
  // delivery_order_waiting_streams); the live remedy remains the one-click switch to Best
  // effort (SetDeliveryOrder).
  MESSAGE_DELIVERY_ORDER_GUARANTEED = 3;
}

// Which per-message timestamp the delivery order compares. This is not Pulsar's message
// `ordering_key` field.
enum DeliveryOrderKey {
  DELIVERY_ORDER_KEY_UNSPECIFIED = 0;
  // Added automatically by the producer. Always present.
  DELIVERY_ORDER_KEY_PUBLISH_TIME = 1;
  // Broker entry metadata recording when an entry arrived. Present only when the broker runs the
  // AppendBrokerTimestampMetadataInterceptor and exposes entry metadata to clients.
  DELIVERY_ORDER_KEY_BROKER_PUBLISH_TIME = 2;
  // An optional timestamp set by the application. A message without one (0) uses publish time
  // and is counted as a fallback.
  DELIVERY_ORDER_KEY_EVENT_TIME = 3;
}

message ConsumerSessionConfig {
  ConsumerSessionStartFrom start_from = 1;
  repeated ConsumerSessionTarget targets = 2;
  MessageFilterChain message_filter_chain = 3;
  ConsumerSessionPauseTriggerChain pause_trigger_chain = 4;
