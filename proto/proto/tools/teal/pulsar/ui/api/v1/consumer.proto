}

message RelativeDateTime {
  int32 value = 1;
  DateTimeUnit unit = 2;
  bool is_rounded_to_unit_start = 3;
}

// Start approximately the given distance through the DATA a topic still holds -
// "about % through the data".
//
// Pulsar can address a position by ENTRY ordinal or by timestamp in constant/log
// time at any topic size, but it has no message-ordinal index unless the operator
// enables brokerEntryMetadataInterceptors (empty by default). So "60% of the way
// in" is resolvable instantly on a billion-message topic, while "skip the first
// 600 million messages" is not - the latter has to count.
//
// This mode therefore advertises an APPROXIMATE position rather than an exact
// message count: the approximation lives in the contract instead of being hidden
// behind it.
//
// Resolved PER PHYSICAL TOPIC: every topic of the session, and every partition of
// a partitioned topic, is positioned against its own backlog.
//
// The counterpart to ApproximateTimePosition, and the distinction is not
// cosmetic. On a topic where 99% of the messages arrived in the last hour of a
// 30-day retention, "50%" of the DATA lands inside that last hour, while 50% of
// the TIME RANGE lands 15 days back. One message used to answer both questions,
// which made it impossible to name or to reason about.
message ApproximateDataPosition {
  // Outside [0.0, 1.0] is rejected. BOTH ENDPOINTS ARE EXACT and neither is an
  // entry ordinal:
  //
  //   0.0 = `MessageId.earliest` - the earliest retained message, exactly as the
  //         "Earliest message" mode.
  //   1.0 = `MessageId.latest` - PAST the last retained message, exactly as the
  //         "Latest message" mode: nothing retained is shown at all, only what is
  //         published from now on. It is NOT "the latest retained message"; that
  //         reading cost a reviewer a round trip, so it is spelled out here.
  //
  // Interior fractions are resolved against ENTRY ordinals, so the position is
  // proportional to stored entries rather than to message count; the two diverge
  // as far as batch sizes varied over the topic's lifetime.
  double fraction = 1;
}

// Start approximately the given distance through the TIME RANGE a topic still
// covers - "about % through the time range".
//
// Resolved PER LOGICAL TOPIC, not per partition: `earliest` is the MINIMUM first-
// message publish time across the topic's partitions, `latest` the MAXIMUM last-
// message publish time across them, and the cutoff is
// `earliest + fraction * (latest - earliest)` (floored to a whole millisecond).
// Every partition is then seeked to that one instant.
//
// Taking min/max across partitions rather than a per-partition quantile is
// deliberate: it gives clean endpoints by construction, is monotonic in the
// fraction, and is independent of the partition count. It also avoids the defect
// ApproximateDataPosition has to live with, where one idle partition drags a
// quantile-based cutoff backwards.
message ApproximateTimePosition {
  // 0.0 = earliest retained message, 1.0 = the last message. Outside [0.0, 1.0]
  // is rejected. Both endpoints are exact rather than interpolated.
  double fraction = 1;
}

message ConsumerSessionStartFrom {
  oneof start_from {
    EarliestMessage start_from_earliest_message = 1;
    LatestMessage start_from_latest_message = 2;
    NthMessageAfterEarliest start_from_nth_message_after_earliest = 6;
    NthMessageBeforeLatest start_from_nth_message_before_latest = 7;
    MessageId start_from_message_id = 3;
    DateTime start_from_date_time = 4;
    RelativeDateTime start_from_relative_date_time = 5;
    ApproximateDataPosition start_from_approximate_data_position = 8;
    ApproximateTimePosition start_from_approximate_time_position = 9;
  }
}

message ConsumerSessionEventMessagesProcessed {
  int64 message_count = 1;
}

message ConsumerSessionEventMessagesDelivered {
  int64 message_count = 1;
}

message ConsumerSessionEventBytesProcessed {
  int64 byte_count = 1;
}

message ConsumerSessionEventBytesDelivered {
  int64 byte_count = 1;
}

message ConsumerSessionEventMessageDecodeFailed {
  int64 fail_count = 1;
}

message ConsumerSessionEventTimeElapsed {
  int64 time_elapsed_ms = 1;
}

message ConsumerSessionEventTopicEndReached {}

message ConsumerSessionEventUnexpectedErrorOccurred {}

message ConsumerSessionEventMessageId {
  MessageId message_id = 1;
}

message ConsumerSessionEvent {
  oneof event {
    ConsumerSessionEventMessagesProcessed event_messages_processed = 1;
    ConsumerSessionEventMessagesDelivered event_messages_delivered = 2;
    ConsumerSessionEventBytesProcessed event_bytes_processed = 3;
    ConsumerSessionEventBytesDelivered event_bytes_delivered = 4;
    ConsumerSessionEventMessageDecodeFailed event_message_decode_failed = 5;
    ConsumerSessionEventTimeElapsed event_time_elapsed = 6;
    ConsumerSessionEventTopicEndReached event_topic_end_reached = 7;
    ConsumerSessionEventUnexpectedErrorOccurred event_unexpected_error_occurred = 8;
    ConsumerSessionEventMessageId event_message_id = 9;
  }
}

enum ConsumerSessionPauseTriggerChainMode {
  CONSUMER_SESSION_PAUSE_TRIGGER_CHAIN_MODE_UNSPECIFIED = 0;
  CONSUMER_SESSION_PAUSE_TRIGGER_CHAIN_MODE_ALL = 1;
  CONSUMER_SESSION_PAUSE_TRIGGER_CHAIN_MODE_ANY = 2;
}

message ConsumerSessionPauseTriggerChain {
  repeated ConsumerSessionEvent events = 1;
  ConsumerSessionPauseTriggerChainMode mode = 2;
}

message ColoringRule {
  bool is_enabled = 4;
  MessageFilterChain message_filter_chain = 1;
  string foreground_color = 2;
  string background_color = 3;
}

message ColoringRuleChain {
  bool is_enabled = 2;
  repeated ColoringRule coloring_rules = 1;
}

message MultiTopicSelector {
