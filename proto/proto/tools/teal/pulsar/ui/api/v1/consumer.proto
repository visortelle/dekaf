message ResolveTopicSelectorRequest {
  TopicSelector topic_selector = 1;
}
message ResolveTopicSelectorResponse {
  google.rpc.Status status = 1;
  repeated string topic_fqns = 2;
}

// One physical topic's endpoints and how far this session has read through them.
//
// A DEBUG VIEW, polled on demand - never pushed with the message stream. Filling one
// row costs three admin round trips (first entry, last entry, internal stats), so a
// session over a wide selector costs three per PARTITION every refresh. That is why
// the client asks for this rather than receiving it, and why the asking is off by
// default.
//
// EVERY FIELD IS OPTIONAL BECAUSE EVERY LOOKUP CAN DECLINE. A topic Pulsar refuses to
// examine at all (non-persistent: 405) answers with `unavailable_reason` set and the
// endpoints absent - which is different from an EMPTY topic, where the lookups
// succeed and there is genuinely nothing to report. Absent means "not known", never
// "zero".
message TopicPosition {
  // The physical topic - a partition of a partitioned topic, not the parent, since
  // `examineMessage` refuses the parent outright.
  string topic_fqn = 1;

  // The oldest message the topic still holds. Absent on an empty topic, and on one
  // whose first entry aged out between the two lookups.
  google.protobuf.BytesValue first_message_id = 2;
  google.protobuf.Int64Value first_publish_time = 3;

  // The newest message the topic holds. Absent on an empty topic: `examineMessage`
  // THROWS for "latest" there rather than answering, where "earliest" clamps.
  google.protobuf.BytesValue last_message_id = 4;
  google.protobuf.Int64Value last_publish_time = 5;

  // The newest message this session has PROCESSED from this topic - which is the read
  // position, not the last row on screen. A session filter can drop almost everything
  // it reads, so the last DISPLAYED message can lag this by an arbitrary amount and
  // would make both progress figures below read far too low.
  //
  // Absent until the session has processed something from this topic.
  google.protobuf.BytesValue cursor_message_id = 6;
  google.protobuf.Int64Value cursor_publish_time = 7;

  // Where the cursor sits in the topic's TIME range: 0.0 at the first message's
  // publish time, 1.0 at the last's. Absent when there is no cursor yet, and on a
  // topic that occupies a single instant (first == last), which has no interior to
  // place anything in.
  google.protobuf.DoubleValue cursor_time_fraction = 8;

  // The PROPORTION OF RETAINED ENTRIES THE SESSION HAS CONSUMED: cursor ordinal
  // over retained count. Sitting ON the first of N entries is 1/N - one entry
  // consumed - and on the last it is 1.0; a topic retaining a single entry is
  // therefore 1.0 the moment that entry is read. There is no 0.0 with a cursor
  // present: a cursor exists only once something was consumed.
  //
  // ENTRIES, NOT MESSAGES. A batched entry holds many messages, so this tracks
  // message count only as closely as batch sizes stayed uniform - the same
  // approximation ApproximateDataPosition documents. It is named for what it measures.
  google.protobuf.DoubleValue cursor_entry_fraction = 9;

  // Entries the topic still retains, as `getInternalStats` reports it.
  google.protobuf.Int64Value retained_entries = 10;

  // The cursor's 1-based ordinal among the retained entries, which is the numerator of
  // `cursor_entry_fraction`. Shown so a reader can see the arithmetic rather than
  // trust a percentage.
  google.protobuf.Int64Value cursor_entry_ordinal = 11;

  // Why this row is blank, when it is. Set for a topic the broker refuses to examine
  // (a non-persistent topic cannot answer either lookup) and for a lookup that failed
  // outright. An EMPTY topic is NOT a reason - it answers, with nothing in it.
  google.protobuf.StringValue unavailable_reason = 12;
}

message GetTopicPositionsRequest {
  string consumer_name = 1;
}

message GetTopicPositionsResponse {
  google.rpc.Status status = 1;
  repeated TopicPosition positions = 2;
}

service ConsumerService {
  rpc CreateConsumer(CreateConsumerRequest) returns (CreateConsumerResponse);
  rpc DeleteConsumer(DeleteConsumerRequest) returns (DeleteConsumerResponse);
  rpc Resume(ResumeRequest) returns (stream ResumeResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc RunCode(RunCodeRequest) returns (RunCodeResponse);
  rpc ResolveTopicSelector(ResolveTopicSelectorRequest) returns (ResolveTopicSelectorResponse);

  // Poll the per-topic debug view. See [[TopicPosition]] for why this is polled rather
  // than pushed.
  rpc GetTopicPositions(GetTopicPositionsRequest) returns (GetTopicPositionsResponse);
}
