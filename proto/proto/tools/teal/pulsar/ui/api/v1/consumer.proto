  ValueProjectionList value_projection_list = 6;
  google.protobuf.Int64Value num_display_items = 7;
  MessageDeliveryOrder message_delivery_order = 8;
  // Absent (UNSPECIFIED) means publish time - the timestamp every ordered session used before this
  // field existed. Meaningful only when message_delivery_order is not as-received.
  DeliveryOrderKey delivery_order_key = 9;
}

