syntax = "proto3";

package tools.teal.pulsar.ui.library.v1;

message InstanceMatcher {}

message ExactTenantMatcher {
  string tenant = 1;
}

message AllTenantMatcher {}

message TenantMatcher {
  oneof matcher {
    ExactTenantMatcher exact = 1;
    AllTenantMatcher all = 2;
  }
}

message ExactNamespaceMatcher {
  TenantMatcher tenant = 1;
  string namespace = 2;
}

message AllNamespaceMatcher {
  TenantMatcher tenant = 1;

  // NOT IMPLEMENTED - setting this field is REJECTED with INVALID_ARGUMENT. It is not ignored:
  // ignoring it returned a matcher covering EVERY namespace of the matching tenant to a caller that
  // had asked for a subset, which is a silent widening of access scope.
  //
  // Unimplemented deliberately, not by oversight: matchers are tested against other matchers rather
  // than against a concrete namespace, so an AllNamespaceMatcher tested against another
  // AllNamespaceMatcher would have to decide whether one regex subsumes another, which is
  // undecidable in general. Leave it unset; narrow with ExactNamespaceMatcher instead.
  string namespace_regex = 2;
}

message NamespaceMatcher {
  oneof matcher {
    ExactNamespaceMatcher exact = 1;
    AllNamespaceMatcher all = 2;
  }
}

message ExactTopicMatcher {
  NamespaceMatcher namespace = 1;
  string topic = 2;
}

message AllTopicMatcher {
  NamespaceMatcher namespace = 1;
}

message TopicMatcher {
  oneof matcher {
    ExactTopicMatcher exact = 1;
    AllTopicMatcher all = 2;
  }
}

message ResourceMatcher {
  oneof matcher {
    InstanceMatcher instance = 4;
    TenantMatcher tenant = 1;
    NamespaceMatcher namespace = 2;
    TopicMatcher topic = 3;
  }
}
